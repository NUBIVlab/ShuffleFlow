name: pnp-dm
_target_: samplers.pnp_dm.PnPDM

annealing_scheduler_config:
  num_steps: 100
  rho_max: 10
  rho_min: 0.03
  alpha: 0.9

diffusion_scheduler_config:
  num_steps: 100
  sigma_min: 1e-2
  sigma_final: 0
  schedule: 'linear'
  timestep: 'poly-7'

lgvd_config:
  num_steps: 100
  lr: 1e-4
  tau: 0.01
  lr_min_ratio: 1.0