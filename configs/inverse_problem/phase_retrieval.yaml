name: phase_retrieval

operator:
  _target_: forward_operators.phase_retrieval.PhaseRetrieval
  name: phase_retrieval
  unnorm_shift: 1.0
  unnorm_scale: 0.5
  oversample: 4.0
  sigma_noise: 1.0e-2

dataset: &inverse_dataset
  _target_: datasets.test_dataset.PhaseRetrievalDataset
  name: afhq-v2
  data_path: <path-to-data>
  group: all
  img_size: 128
  num_channels: 1
  n_dims: 2
  normalize: false
  centered: false
  idx_list: null
  cmap: 'gray'

train_dataset:
  <<: *inverse_dataset
  _target_: datasets.train_dataset.AFHQv2Dataset

data_generator: 
  _target_: data_generators.phase_retrieval.PhaseRetrievalDataGenerator
  operator: ${inverse_problem.operator}
  dataset: ${inverse_problem.dataset}
  n_vis: 20

evaluator:
  _target_: evaluators.image.ImageEvaluator